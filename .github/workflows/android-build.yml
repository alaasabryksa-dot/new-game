name: Android offline APK
on:
  push:
    branches: [main]
    paths:
      - "game-project/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-project/package-lock.json

      - name: Install web dependencies
        working-directory: game-project
        run: npm ci

      - name: Build the self-contained offline game bundle
        working-directory: game-project
        run: npm run build:android-web

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Assemble debug APK
        working-directory: game-project/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK package and signature
        run: |
          set -euo pipefail
          APK="game-project/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.tuktok.darelsalam'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Launch APK in Android emulator and verify game startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none -camera-front none
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            adb wait-for-device
            booted=0
            for attempt in $(seq 1 90); do
              state="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r' || true)"
              if [ "$state" = "1" ] && adb shell pm list packages >/dev/null 2>&1; then
                booted=1
                break
              fi
              echo "Waiting for Android emulator boot ($attempt/90); state=$state"
              sleep 2
            done
            if [ "$booted" -ne 1 ]; then
              adb devices -l || true
              adb logcat -d -t 500 || true
              echo "Android emulator did not finish booting"
              exit 1
            fi
            adb install -r game-project/android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.tuktok.darelsalam || true
            adb shell am start -n com.tuktok.darelsalam/.MainActivity
            ready=0
            for attempt in $(seq 1 45); do
              if adb logcat -d -s TuktokDarElsalam:I TuktokDarElsalam:E | grep -q "GAME_READY"; then
                ready=1
                break
              fi
              if ! adb shell pidof com.tuktok.darelsalam >/dev/null 2>&1; then
                echo "Game process exited before GAME_READY"
                adb logcat -d -v time || true
                exit 1
              fi
              sleep 2
            done
            adb logcat -d -v time -s TuktokDarElsalam:I TuktokDarElsalam:E chromium:E AndroidRuntime:E | tee android-startup.log
            if [ "$ready" -ne 1 ]; then
              echo "Android game did not report GAME_READY"
              adb logcat -d -v time || true
              exit 1
            fi
            adb shell pidof com.tuktok.darelsalam

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Tuktok-Dar-El-Salam-debug-APK
          path: game-project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
