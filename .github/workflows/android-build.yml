name: Android offline APK
on:
  push:
    branches: [main]
    paths:
      - "game-project/**"
      - ".github/workflows/android-build.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-project/package-lock.json

      - name: Install web dependencies
        working-directory: game-project
        run: npm ci

      - name: Build the self-contained offline game bundle
        working-directory: game-project
        run: npm run build:android-web

      - name: Install Chromium for Android-targeted bundle smoke test
        working-directory: game-project
        run: npx playwright install --with-deps chromium

      - name: Test Android offline bundle and gameplay startup
        working-directory: game-project
        run: node scripts/android-bundle-smoke.mjs

      - name: Verify Android web entry and local assets
        run: |
          set -euo pipefail
          ASSETS="game-project/android/app/src/main/assets/public"
          test -s "$ASSETS/android.html"
          grep -q "assets/" "$ASSETS/android.html" || true
          find "$ASSETS" -type f -printf '%s %p\\n' | sort -nr | head -20
          test "$(find "$ASSETS" -type f | wc -l)" -gt 5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Assemble debug APK
        working-directory: game-project/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK package, assets and signature
        run: |
          set -euo pipefail
          APK="game-project/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q "assets/public/android.html"
          unzip -l "$APK" | grep -q "assets/public/assets/"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.tuktok.darelsalam'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Save APK for isolated device test
        uses: actions/upload-artifact@v4
        with:
          name: tuktuk-apk-candidate
          path: game-project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

  test-on-clean-emulator:
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download APK candidate
        uses: actions/download-artifact@v4
        with:
          name: tuktuk-apk-candidate
          path: artifacts

      - name: Launch APK on an isolated Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data -memory 4096 -cores 4
          emulator-boot-timeout: 900
          script: APK_PATH=artifacts/app-debug.apk bash .github/scripts/test-android-startup.sh

      - name: Publish APK only after Android startup passes
        uses: actions/upload-artifact@v4
        with:
          name: Tuktuk-Dar-El-Salam-verified-APK
          path: artifacts/app-debug.apk
          if-no-files-found: error
          retention-days: 14
