name: Android offline APK
on:
  push:
    branches: [main]
    paths:
      - "game-project/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-project/package-lock.json

      - name: Install web dependencies
        working-directory: game-project
        run: npm ci

      - name: Build the self-contained offline game bundle
        working-directory: game-project
        run: npm run build:android-web

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Assemble debug APK
        working-directory: game-project/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Launch APK in Android emulator and verify game startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none -camera-front none
          script: |
            adb install game-project/android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.tuktok.darelsalam/.MainActivity
            sleep 45
            adb shell pidof com.tuktok.darelsalam
            adb logcat -d -s TuktokDarElsalam:I TuktokDarElsalam:E | tee android-startup.log
            grep -q "GAME_READY" android-startup.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Tuktok-Dar-El-Salam-debug-APK
          path: game-project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
