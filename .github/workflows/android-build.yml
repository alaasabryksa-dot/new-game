name: Android offline APK
on:
  push:
    branches: [main]
    paths:
      - "game-project/**"
      - ".github/workflows/android-build.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-project/package-lock.json

      - name: Install web dependencies
        working-directory: game-project
        run: npm ci

      - name: Capture dependency security audit
        working-directory: game-project
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_status=$?
          node -e 'const r=require("./npm-audit.json"); console.log("Dependency audit summary:", JSON.stringify(r.metadata?.vulnerabilities ?? {})); for (const [name,v] of Object.entries(r.vulnerabilities ?? {})) console.log(JSON.stringify({package:name,severity:v.severity,direct:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via}));'
          echo "npm audit exit code: $audit_status"
          if [ "$audit_status" -ne 0 ]; then exit "$audit_status"; fi
      - name: Build the self-contained offline game bundle
        working-directory: game-project
        run: npm run build:android-web

      - name: Install Chromium for Android-targeted bundle smoke test
        working-directory: game-project
        run: npx playwright install --with-deps chromium

      - name: Test Android offline bundle and gameplay startup
        working-directory: game-project
        run: node scripts/android-bundle-smoke.mjs

      - name: Verify Android web entry and local assets
        run: |
          set -euo pipefail
          ASSETS="game-project/android/app/src/main/assets/public"
          test -s "$ASSETS/android.html"
          grep -q "assets/" "$ASSETS/android.html" || true
          find "$ASSETS" -type f -printf '%s %p\\n' | sort -nr | head -20
          test "$(find "$ASSETS" -type f | wc -l)" -gt 5

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Assemble debug APK
        working-directory: game-project/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK package, assets and signature
        run: |
          set -euo pipefail
          APK="game-project/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q "assets/public/android.html"
          unzip -l "$APK" | grep -q "assets/public/assets/"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.tuktok.darelsalam'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Save dependency audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-dependency-audit
          path: game-project/npm-audit.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Save APK for isolated device test
        uses: actions/upload-artifact@v7
        with:
          name: tuktuk-apk-candidate
          path: game-project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

  # Emulator startup is intentionally manual-only: do not repeat expensive
  # emulator attempts on every source commit while the Android renderer issue
  # is being resolved.
  test-on-clean-emulator:
    if: github.event_name == 'workflow_dispatch'
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download APK candidate
        uses: actions/download-artifact@v8
        with:
          name: tuktuk-apk-candidate
          path: artifacts

      - name: Launch APK on an isolated Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data -memory 4096 -cores 4
          emulator-boot-timeout: 900
          script: APK_PATH=artifacts/app-debug.apk bash .github/scripts/test-android-startup.sh

      - name: Publish APK only after Android startup passes
        uses: actions/upload-artifact@v7
        with:
          name: Tuktuk-Dar-El-Salam-verified-APK
          path: artifacts/app-debug.apk
          if-no-files-found: error
          retention-days: 14
