name: Verify extracted game

on:
  push:
    branches: [main]
    paths:
      - "game-project/**"
      - ".github/workflows/verify-game.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game-project
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-project/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for gameplay smoke test
        run: npx playwright install --with-deps chromium
      - name: Type check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Start development server
        run: |
          npm run dev > /tmp/new-game-vite.log 2>&1 &
          echo $! > /tmp/new-game-vite.pid
      - name: Wait for development server
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/new-game-vite.log
          exit 1
      - name: Smoke test landscape mobile gameplay
        run: npm run test:browser
      - name: Build self-contained Android web bundle
        run: npm run build:android-web
      - name: Smoke test offline Android bundle in mobile WebView-like browser
        run: node scripts/android-bundle-smoke.mjs
      - name: Production build
        run: npm run build
